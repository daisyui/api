name: Create Special Discount

on:
  workflow_dispatch:
    inputs:
      discount_percentage:
        description: "Percentage"
        required: true
        type: string
      discount_days:
        description: "Days"
        required: true
        type: string
      discount_title:
        description: "Title"
        required: true
        type: string
      discount_code:
        description: "Code"
        required: false
        type: string
      product_ids:
        description: "Product IDs, separated by commas or spaces. Leave empty for all products."
        required: false
        type: string
      banner_text:
        description: "Optional text after the discount title"
        required: false
        type: string
      banner_url:
        description: "Banner link, for example /store/blink/"
        required: false
        default: "/store/"
        type: string

jobs:
  run-node-command:
    runs-on: ubuntu-latest
    env:
      CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v1.2.2

      - name: Build log
        run: bun build_log.js

      - name: Create Discount
        env:
          DISCOUNT_PERCENTAGE: ${{ inputs.discount_percentage }}
          DISCOUNT_DAYS: ${{ inputs.discount_days }}
          DISCOUNT_TITLE: ${{ inputs.discount_title }}
          DISCOUNT_CODE: ${{ inputs.discount_code }}
          DISCOUNT_PRODUCT_IDS: ${{ inputs.product_ids }}
          DISCOUNT_BANNER_TEXT: ${{ inputs.banner_text }}
          DISCOUNT_BANNER_URL: ${{ inputs.banner_url }}
        run: |
          bun discount_special.js "$DISCOUNT_PERCENTAGE" "$DISCOUNT_DAYS" "$DISCOUNT_TITLE" "$DISCOUNT_CODE" "$DISCOUNT_PRODUCT_IDS" "$DISCOUNT_BANNER_TEXT" "$DISCOUNT_BANNER_URL"

      - name: Configure Git
        run: |
          git config --local user.email "pouya.saadeghi@gmail.com"
          git config --local user.name "Pouya Saadeghi"

      - name: Commit changes
        run: |
          git add .
          git diff-index --quiet HEAD || git commit -m "Update API data"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
